# ============================================================================
# 公式知识图谱 · Neo4j 部署包 docker-compose.yml
# 配套：neo4j/ 目录（nodes.csv / relationships.csv / neo4j_ready.json）
# 用法：
#   cp .env.example .env       # 按需修改密码
#   docker compose up -d       # 启动
# ============================================================================
services:
  neo4j:
    image: neo4j:5.21                        # Neo4j 5.x 社区版（内置 APOC）
    container_name: formula-graph-neo4j
    restart: unless-stopped
    environment:
      # 认证：格式 user/password（与 .env 的 NEO4J_AUTH 保持一致）
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/formula_graph_2026}
      # 启用 APOC 插件（load_neo4j.py 的 apoc.merge.* 依赖它）
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_auth_minimum__password__length: "6"
      # 内存配置（按需调整）
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "1g"
    ports:
      - "7474:7474"   # HTTP / Browser UI
      - "7687:7687"   # Bolt 驱动端口
    volumes:
      - neo4j_data:/data                    # 命名卷：持久化图数据
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # 关键：把包目录挂进容器内 /deploy，供 cypher-shell -f /deploy/load.cypher 使用
      - ./:/deploy
    healthcheck:
      # 用容器内 cypher-shell 探活（需 NEO4J_AUTH 环境变量在容器内生效）
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  neo4j_data:
    name: formula-graph-neo4j-data
  neo4j_logs:
    name: formula-graph-neo4j-logs
  neo4j_plugins:
    name: formula-graph-neo4j-plugins
