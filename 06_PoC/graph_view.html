<style>
  :root {
    --bg: #0f1419; --panel: #1a2230; --panel-2: #222c3c; --line: #2e3a4d;
    --text: #e6edf3; --muted: #9aa7b8; --accent: #4C72B0; --warn: #DD8452;
    --hover: #2c3850; --canvas: #0b0f15;
    --left-w: 288px; --right-w: 344px;
    /* 五态色（与 js/core.js 的 STATUS_STYLE 同源；启动时由 JS 覆写以保单一来源） */
    --st-ok: #3fb950; --st-no-result: #8b949e; --st-truncated: #d29922;
    --st-timeout: #f0883e; --st-error: #f85149;
    --radius: 6px;
    --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-columns: var(--left-w) 1fr var(--right-w);
    grid-template-rows: 52px 1fr minmax(158px, auto);
    grid-template-areas:
      "header header header"
      "left   canvas right"
      "left   bottom right";
    height: 100vh; overflow: hidden;
  }
  body.panel-collapsed { --left-w: 44px; }

  /* ---------- 焦点可见（键盘导航） ---------- */
  :focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  header {
    grid-area: header; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 14px; min-width: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .spacer { flex: 1; }
  #ds-status { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
  .toolbtn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 5px 10px; font-size: 12px; cursor: pointer;
    transition: background .18s ease;
  }
  .toolbtn:hover:not(:disabled) { background: var(--hover); }
  .toolbtn:disabled { opacity: .45; cursor: not-allowed; }
  .toolbtn.primary { background: #21406b; border-color: #3d6ba8; }
  .toolbtn.tiny { padding: 3px 7px; font-size: 11px; }

  /* ---------- 搜索 ---------- */
  #search-wrap { position: relative; width: 300px; min-width: 140px; }
  #search-input { width: 100%; }
  #search-results {
    position: absolute; top: 30px; left: 0; right: 0; z-index: 60; max-height: 340px; overflow: auto;
    background: var(--canvas); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  .sr-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #1c2534; }
  .sr-item:hover, .sr-item:focus { background: var(--hover); }
  .sr-label { font-size: 12.5px; }
  .sr-meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .sr-empty { padding: 9px 10px; font-size: 12px; color: var(--muted); }

  /* ---------- 模式角标 ---------- */
  .mode-badge { font-size: 11px; }
  .mode-live { border-color: #3d6ba8; color: #9ecbff; }
  .mode-bundle { border-color: #d29922; color: #f0c674; }
  .mode-offline { border-color: #f85149; color: #ff9d97; }

  /* ---------- 三栏 ---------- */
  #left  { grid-area: left;  background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  #right { grid-area: right; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  #canvas { grid-area: canvas; position: relative; min-width: 0; }
  #cy { width: 100%; height: 100%; display: block; background: var(--canvas); }
  #bottom {
    grid-area: bottom; background: var(--panel); border-top: 1px solid var(--line);
    padding: 8px 14px; overflow: auto;
  }
  #left.collapsed { padding: 8px 4px; }
  #left.collapsed > *:not(#left-toolbar) { display: none; }

  .section { margin-bottom: 15px; }
  .section h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0 0 7px; font-weight: 600;
  }
  .chkline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin: 4px 0; cursor: pointer; }
  .chkbox { max-height: 210px; overflow-y: auto; padding-right: 4px; }
  .cdot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .chk { accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=text], input[type=number], select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius); padding: 5px 8px; font-size: 12.5px; width: 100%;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .minilbl { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip {
    font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 2px 8px; cursor: pointer;
  }
  .chip:hover { background: var(--hover); }
  .more[hidden] { display: none; }

  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
  .line-chip { width: 22px; height: 0; border-top-width: 3px; border-top-style: solid; flex: 0 0 auto; }
  .shape-chip { width: 14px; height: 14px; border: 2px solid; flex: 0 0 auto; }

  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    margin: 2px 4px 2px 0; background: var(--panel-2); border: 1px solid var(--line);
  }
  .pill { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .pill.warn { color: #f0c674; }
  .pill.err { color: #ff9d97; }
  .pill.ok { color: #7fd18a; }
  .note { font-size: 11px; color: var(--muted); }
  .warn { color: #f0c674; }
  code { background: var(--canvas); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; font-family: var(--mono); }
  code.hash { color: #9aa7b8; }

  /* ---------- 画布叠加层 ---------- */
  #substack {
    position: absolute; top: 10px; left: 10px; z-index: 20; display: flex; gap: 6px; align-items: center;
    background: rgba(26,34,48,.92); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 6px 8px; max-width: calc(100% - 20px); flex-wrap: wrap;
  }
  #substack-info { font-size: 11.5px; color: var(--muted); }
  #expand-hint { font-size: 11px; color: var(--accent); }
  #tooltip {
    position: absolute; z-index: 50; display: none; pointer-events: none;
    max-width: 340px; background: var(--canvas); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 10px; font-size: 11.5px; line-height: 1.5;
    color: var(--text); box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #tooltip b { color: #bcd; }
  #fallback {
    display: none; position: absolute; inset: 0; z-index: 30; overflow: auto; padding: 16px;
    background: var(--canvas); font-size: 12.5px; white-space: pre-wrap; color: var(--muted);
  }

  /* ---------- 五态状态行（颜色 + 图标 + 文字三重编码） ---------- */
  #statusline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .stchip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap;
  }
  .st-icon { flex: 0 0 auto; }
  .stchip.st-ok { color: var(--st-ok); }
  .stchip.st-no-result { color: var(--st-no-result); }
  .stchip.st-truncated { color: var(--st-truncated); }
  .stchip.st-timeout { color: var(--st-timeout); }
  .stchip.st-error { color: var(--st-error); }
  .st-hint { font-size: 11px; color: var(--muted); }

  .banner {
    display: flex; gap: 9px; align-items: flex-start; border: 1px solid currentColor;
    border-left-width: 4px; border-radius: var(--radius); padding: 7px 10px; margin-bottom: 6px;
    background: rgba(255,255,255,.02);
  }
  .banner[hidden] { display: none; }
  .banner .bicon { flex: 0 0 auto; margin-top: 1px; }
  .banner .bt { font-size: 12.5px; }
  .banner .bact { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .banner.st-ok { color: var(--st-ok); }
  .banner.st-no-result { color: var(--st-no-result); }
  .banner.st-truncated { color: var(--st-truncated); }
  .banner.st-timeout { color: var(--st-timeout); }
  .banner.st-error { color: var(--st-error); }
  .banner .note { color: var(--muted); }

  /* ---------- F12 空结果诊断（D69）：为什么是空的 + 一键放宽 ----------
     ok + 0 边用 `st-empty`（中性灰）：既不能染成绿色"正常"，
     也不能冒充 no_result —— 五态是另一条断言（状态行）在管。 */
  .banner.st-empty { color: var(--st-no-result); }
  .banner .ed-cnt { list-style: none; margin: 5px 0 0; padding: 0; display: grid; gap: 2px; }
  .banner .ed-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; line-height: 1.45; }
  .banner .ed-k { color: var(--text); min-width: 82px; }
  .banner .ed-v { color: var(--text); }
  .banner .ed-row.dead .ed-v { color: var(--muted); }
  .banner .ed-scope, .banner .ed-bound { font-size: 11.5px; line-height: 1.5; }
  .banner .ed-bound { margin-top: 4px; }
  .banner .ed-note { margin-top: 4px; color: var(--warn); font-size: 11.5px; }
  .banner .ed-not-fail { margin-bottom: 3px; }

  /* ---------- 详情 / 证据 ---------- */
  .detail-title { font-size: 16px; font-weight: 700; margin: 0 0 2px; word-break: break-all; }
  .detail-block { margin-top: 11px; }
  .detail-block .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .detail-block .val { font-size: 12.5px; line-height: 1.5; margin-top: 3px; word-break: break-word; }
  /* Phase 64 · M3：变量表与适用条件（右栏最窄 320px，一律用 wrap 而不是截断） */
  .symtab { display: grid; gap: 3px; }
  .symrow {
    display: grid; grid-template-columns: minmax(34px, max-content) 1fr max-content;
    gap: 0 8px; align-items: baseline; font-size: 12px;
  }
  .symrow .sym {
    font-family: var(--mono); font-size: 12px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 5px; text-align: center; overflow-wrap: anywhere;
  }
  .symrow .sym.missing { color: var(--muted); background: transparent; border-style: dashed; }
  .symrow .qty { color: var(--muted); overflow-wrap: anywhere; }
  .symrow .symsrc { white-space: nowrap; }
  .appitem + .appitem { margin-top: 5px; }
  .appitem .appterm {
    display: inline-block; font-size: 12.5px; color: var(--text);
    border-left: 2px solid var(--accent); padding-left: 7px;
  }
  .appitem .note { margin-top: 1px; }
  .whyyrow { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-left: 3px solid var(--accent); background: rgba(76,114,176,.12); border-radius: 4px; margin-bottom: 9px; }
  .whyyrow.unknown { border-left-color: var(--st-error); background: rgba(248,81,73,.12); }
  .whyyrow .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .whyyrow .val { font-size: 12.5px; }
  .vbadge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid; }
  .stale-banner { font-size: 12px; color: #f0c674; border: 1px solid #d29922; border-radius: var(--radius); padding: 5px 8px; margin-bottom: 8px; }
  /* Phase 44 · D1：证据字节忠实度「一致」态（绿）与「不可从仓库复算」（灰）分列显示 */
  .fidelity-ok { font-size: 11.5px; border-left: 3px solid currentColor; background: var(--panel-2); border-radius: var(--radius); padding: 4px 8px; margin-bottom: 8px; }
  .stale-banner .hint { margin-top: 3px; }
  .legend-item.note { color: var(--muted); font-size: 11px; line-height: 1.5; display: block; }
  .evcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; margin: 6px 0; background: var(--panel-2); }
  .evhead { font-size: 11.5px; font-weight: 600; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .evrow { display: flex; gap: 8px; font-size: 11.5px; margin: 2px 0; }
  .evrow .k { flex: 0 0 96px; color: var(--muted); }
  .evrow .v { flex: 1; word-break: break-all; }
  .latex { background: var(--canvas); border-radius: 4px; padding: 6px 8px; overflow-x: auto; margin-bottom: 5px; }
  .empty { color: var(--muted); font-size: 12.5px; }

  /* ---------- 底栏：路径 ---------- */
  #bottom .pathrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #bottom input[type=text] { width: 208px; }
  #path-status { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  #path-list { font-size: 11.5px; margin-top: 6px; max-height: 96px; overflow: auto; }
  .pathcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; margin: 4px 0; cursor: pointer; background: var(--panel-2); }
  .pathcard:hover { background: var(--hover); }
  .pathcard.active { border-color: #ffd166; box-shadow: 0 0 0 1px #ffd166 inset; }
  .pathcard .phead { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .pn { padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--canvas); white-space: nowrap; font-size: 11.5px; }
  .pn-src { border-color: #38d9a9; color: #9ef0d5; }
  .pn-dst { border-color: #ff8787; color: #ffc4c4; }
  .pn-mid { border-color: #ffd166; color: #ffe6a8; }
  .ph { font-size: 10px; color: var(--muted); }

  /* ---------- Phase 49 · 任务式首屏（问题 → 候选 → 确认实体 → 生成） ---------- */
  #task-entry[hidden] { display: none; }
  #task-entry {
    position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
    padding: 22px; overflow: auto;
  }
  .tp-scrim { position: absolute; inset: 0; background: rgba(11, 15, 21, .88); }
  .tp-panel {
    position: relative; width: min(960px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px 18px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .62);
  }
  .tp-head h2 {
    font-size: 19px; margin: 0 0 7px; font-weight: 650; letter-spacing: .2px;
    border-left: 3px solid var(--accent); padding-left: 10px;
  }
  .tp-sub { margin: 0 0 16px 13px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .tp-q { margin-bottom: 4px; }
  .tp-q .note { margin-left: 6px; }
  .tp-row { display: flex; gap: 8px; align-items: stretch; }
  #task-q { flex: 1; font-size: 14px; padding: 9px 11px; }
  #task-q2 { font-size: 13px; padding: 7px 10px; }
  .tp-q2 { margin-top: 12px; }
  .tp-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 14px 0 2px; }
  .tcard {
    text-align: left; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: var(--radius); padding: 10px 11px; cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  .tcard:hover { background: var(--hover); border-color: #3d6ba8; }
  .tcard-q { display: block; font-size: 12.5px; line-height: 1.45; }
  .tcard-h { display: block; font-size: 10.5px; color: var(--muted); margin-top: 7px; }
  .tp-cands { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .tp-cands[hidden] { display: none; }
  .cand-head {
    font-size: 11px; color: var(--muted); margin: 10px 0 7px;
    text-transform: uppercase; letter-spacing: .5px; line-height: 1.6;
  }
  .cand-head .note { text-transform: none; letter-spacing: 0; }
  .cand-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; }
  .cand-item {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel-2); cursor: pointer; font-size: 12.5px;
  }
  .cand-item:hover, .cand-item:focus { background: var(--hover); }
  .cand-item.sel { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff inset; }
  .cand-item .cand-label { font-weight: 600; }
  .cand-empty { padding: 9px 10px; font-size: 12px; color: var(--muted); }
  .cand-empty.err { color: #ff9d97; }
  .tp-scope { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .tp-scope h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 0 0 9px; font-weight: 600;
  }
  .tp-scope h3 .note { text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .tp-scope-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tp-run { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #task-run { padding: 8px 18px; font-size: 13px; }
  #task-status { margin-top: 9px; line-height: 1.6; }
  body.task-open #canvas, body.task-open #bottom { filter: saturate(.7); }

  /* ---------- 响应式（375 / 768 / 1024 / 1440） ---------- */
  @media (max-width: 1439px) {
    :root { --left-w: 268px; --right-w: 320px; }
    #search-wrap { width: 240px; }
  }
  @media (max-width: 1023px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 52px minmax(220px, 44vh) minmax(220px, 1fr) minmax(150px, auto);
      grid-template-areas: "header" "canvas" "left" "bottom";
      height: auto; min-height: 100vh; overflow: visible;
    }
    #left { border-right: none; border-top: 1px solid var(--line); max-height: 46vh; }
    #right { display: none; }
    #search-wrap { width: 200px; }
    #ds-status { max-width: 30vw; }
    .tp-cards { grid-template-columns: repeat(2, 1fr); }
    .tp-scope-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 767px) {
    header { gap: 6px; padding: 0 8px; flex-wrap: wrap; }
    header h1 { font-size: 13px; }
    #search-wrap { width: 150px; }
    #bottom input[type=text] { width: 100%; }
    .grid2 { grid-template-columns: 1fr; }
    #task-entry { padding: 10px; }
    .tp-panel { padding: 15px 14px 13px; }
    .tp-cards { grid-template-columns: 1fr; }
    .tp-scope-grid { grid-template-columns: repeat(2, 1fr); }
    .cand-list { grid-template-columns: 1fr; }
  }
  @media (max-width: 375px) {
    header h1 { font-size: 12px; }
    #ds-status { display: none; }
    #search-wrap { width: 120px; }
  }
</style>
</head>
<body>

<!-- ============================================================
     Phase 49 · 任务式首屏（默认可见；生成子图后由 JS 隐藏）
     结构由 js/task.js 的 TaskEntry.mount() 填充 —— 这里只留挂载点，
     避免"DOM 结构写两遍"（一处改了另一处没改 ⇒ 静默错位）。
     ============================================================ -->
<div id="task-entry"></div>

<header>
  <h1>公式知识图谱 · 局部查询</h1>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="搜索实体 / 公式 / 概念…" autocomplete="off" aria-label="全局搜索" />
    <div id="search-results" hidden></div>
  </div>
  <span class="badge mode-badge" id="mode-badge" data-mode="live">实时查询</span>
  <div class="spacer"></div>
  <!-- ★ 生成图之后想改查询 ⇒ 回到首屏（保留上次输入与已确认实体） -->
  <button class="toolbtn" id="btn-reopen-task" hidden title="回到任务入口，修改问题 / 实体 / 范围">← 修改查询</button>
  <button class="toolbtn" id="btn-overview" title="聚合元图（学科 × 类型），替代「全图浏览」">概览</button>
  <button class="toolbtn" id="btn-export-png" title="导出当前子图 PNG（含快照水印）">PNG</button>
  <button class="toolbtn" id="btn-export-svg" title="导出当前子图 SVG">SVG</button>
  <button class="toolbtn" id="btn-export-json" title="导出 JSON 快照（子图 + 证据 + snapshot_id）">JSON</button>
  <span id="ds-status">初始化…</span>
</header>

<aside id="left">
  <div id="left-toolbar">
    <button class="toolbtn tiny" id="btn-toggle-panel" aria-expanded="true" title="折叠/展开查询面板">面板</button>
  </div>
  <div id="panel-query"></div>
  <div class="section">
    <h3>图例</h3>
    <div id="legend"></div>
  </div>
</aside>

<main id="canvas">
  <div id="substack">
    <button class="toolbtn" id="btn-back" title="返回上一层（同时回滚会话计数）">← 返回</button>
    <button class="toolbtn" id="btn-expand" title="展开选中节点的邻居">＋ 展开邻居</button>
    <button class="toolbtn" id="btn-fit" title="适应视口">适应</button>
    <button class="toolbtn" id="btn-reset-view" title="清空当前会话（图 + 计数）">重置会话</button>
    <select id="sel-layout" aria-label="布局">
      <option value="fcose">力导（fcose）</option>
      <option value="concentric">同心圆</option>
      <option value="breadthfirst">层次</option>
      <option value="circle">环形</option>
      <option value="grid">网格</option>
    </select>
    <span id="substack-info"></span>
    <span id="expand-hint"></span>
  </div>
  <div id="cy"></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="fallback"></div>
</main>

<aside id="right">
  <div id="detail"></div>
</aside>

<footer id="bottom">
  <div id="statusline" data-state="ok"></div>
  <div id="banner" class="banner" hidden></div>
  <div class="pathrow">
    <label class="pill" for="path-src">起点</label>
    <input type="text" id="path-src" placeholder="节点 id" />
    <button class="toolbtn" id="btn-pick-src" title="把当前选中节点设为起点">取选中</button>
    <label class="pill" for="path-dst">终点</label>
    <input type="text" id="path-dst" placeholder="节点 id" />
    <button class="toolbtn" id="btn-pick-dst" title="把当前选中节点设为终点">取选中</button>
    <button class="toolbtn" id="btn-path-swap">交换</button>
    <button class="toolbtn primary" id="btn-path">高亮路径</button>
    <button class="toolbtn" id="btn-path-clear">清除</button>
  </div>
  <div id="path-status">路径查询走统一信封端点 <code>/api/subgraph?mode=path</code>；超时/无路径会如实区分。</div>
  <div id="path-list"></div>
</footer>

<!-- ★ 原生 ES Module（零构建）：不需要打包器、不需要 package.json，离线照开 -->
<script type="module" src="js/main.js"></script>
</body>
</html>
