# ---- 解释器约束（★ 这里**不是** pip 分发，故不再是 `python==…` 一行）----
# 目标解释器：**CPython 3.11.9**（本项目实测环境；**不要**用 3.13 —— 未验证）。
# ★ A05 修复：原文件此处写 `python==3.11.9`，与下方 pip 分发**混列** ⇒
#   `pip install -r requirements.lock` 会去找一个名为 `python` 的**分发**
#   （PyPI 上确有一个长期无人维护的同名包）⇒ 装错东西或直接失败。
# 机器可读的解释器约束现在写在 **`pyproject.toml` 的
#   `requires-python = ">=3.11,<3.12"`**（由 `bash sttp.sh install` 自检强制）。
# 本文件自此**只列 pip 安装的分发**。
#
# 复现命令（解释器与依赖分两步，不再混在一条 pip 命令里）：
#   python3.11 -m venv .venv && . .venv/bin/activate     # ① 先备好 3.11.x 解释器
#   pip install -r requirements.lock                     # ② 再装分发

